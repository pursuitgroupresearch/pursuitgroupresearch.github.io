- when: May 2024
  kind: Publication
  title: Fludrocortisone plus hydrocortisone in septic shock
  summary: >-
    A network meta-analysis of randomized trials suggests that adding
    fludrocortisone to hydrocortisone may lower mortality compared with
    hydrocortisone alone.
  source: American Journal of Respiratory and Critical Care Medicine
  url: https://doi.org/10.1164/rccm.202310-1785OC

